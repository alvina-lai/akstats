name: Practice data

# Checks that the downloadable scripts match the app, that they reproduce the bundled datasets exactly,
# and that the R versions run.
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned packages
        run: pip install -r tools/requirements.txt
      - name: Scripts match the app's Practice datasets lesson
        run: python tools/export_scripts.py --check
      - name: Scripts reproduce the bundled CSVs
        run: python tools/build_practice_data.py --check

  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Run the R generators (base R only)
        run: |
          mkdir -p "$RUNNER_TEMP/data" && cd "$RUNNER_TEMP/data"
          for script in generate_data generate_more_data generate_extra_data generate_simulations; do
            Rscript --vanilla "$GITHUB_WORKSPACE/scripts/r/$script.R"
          done
          count=$(ls *.csv | wc -l)
          echo "$count CSV files"
          test "$count" -eq 30
